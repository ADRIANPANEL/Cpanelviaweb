<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CILOK JASMIN - Premium Street Food</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0a0a0c;
            --card-bg: rgba(22, 22, 29, 0.7);
            --accent-gold: #e5b94c;
            --accent-glow: #ffc83b;
            --text-main: #f8f9fa;
            --text-muted: #a0a0ab;
            --border-color: rgba(229, 185, 76, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(229, 185, 76, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(229, 185, 76, 0.05) 0%, transparent 40%);
        }

        /* HEADER & HERO */
        header {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, rgba(10,10,12,0.8) 0%, var(--bg-main) 100%),
                        url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1000&q=80') center/cover;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        .badge {
            background: rgba(229, 185, 76, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(229, 185, 76, 0.3);
        }

        header h1 {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #fff, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(229, 185, 76, 0.2);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
        }

        .info-pills {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 25px;
        }

        .pill {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill i { color: var(--accent-gold); }

        /* CONTAINER & LAYOUT */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .section-header {
            margin-bottom: 25px;
        }

        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* MENU GRID */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .menu-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 30px rgba(229, 185, 76, 0.15);
        }

        .menu-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .menu-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .menu-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .price {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .btn-add {
            background: var(--accent-gold);
            color: #000;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add:hover {
            background: var(--accent-glow);
            transform: scale(1.05);
        }

        .spicy-select {
            width: 100%;
            background: #121217;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-top: 10px;
            outline: none;
        }

        /* CART & CHECKOUT SIDEBAR */
        .sidebar {
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .cart-box {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .cart-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.03);
            padding: 10px 12px;
            border-radius: 10px;
        }

        .cart-item-info h4 {
            font-size: 0.9rem;
        }

        .cart-item-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: #252530;
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        .form-input {
            width: 100%;
            background: #121217;
            border: 1px solid #2a2a35;
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .form-input:focus {
            border-color: var(--accent-gold);
            outline: none;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            margin: 15px 0;
            color: var(--accent-gold);
        }

        .btn-checkout {
            width: 100%;
            background: linear-gradient(45deg, #25d366, #128c7e);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3);
        }

        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(37, 211, 102, 0.5);
        }

        .empty-cart {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="badge">👑 Heat • Eat • Repeat</div>
        <h1>CILOK JASMIN</h1>
        <p>Cita Rasa Perpaduan Tradisional Jawa, Minang & Sunda Premium</p>

        <div class="info-pills">
            <div class="pill"><i class="fa-solid fa-clock"></i> Buka 24 Jam</div>
            <div class="pill"><i class="fa-solid fa-location-dot"></i> Ragajaya, Bojonggede</div>
            <div class="pill"><i class="fa-solid fa-bolt"></i> Dapur Umum / Cepat Saji</div>
        </div>
    </header>

    <div class="container">
        <!-- KATALOG MENU -->
        <div>
            <div class="section-header">
                <h2>Pilih Menu Favoritmu</h2>
            </div>

            <div class="menu-grid" id="menu-container">
                <!-- Data menu diisi via JavaScript -->
            </div>
        </div>

        <!-- SIDEBAR KERANJANG BELANJA -->
        <div class="sidebar">
            <div class="cart-box">
                <div class="cart-header">
                    <h3><i class="fa-solid fa-basket-shopping" style="color: var(--accent-gold);"></i> Pesanan Kamu</h3>
                    <span id="cart-count" style="background: var(--accent-gold); color: #000; padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 0.8rem;">0</span>
                </div>

                <div class="cart-items" id="cart-items">
                    <div class="empty-cart">Keranjang masih kosong.<br>Pilih menu di samping!</div>
                </div>

                <div class="cart-total">
                    <span>Total Pembayaran:</span>
                    <span id="total-price">Rp 0</span>
                </div>

                <hr style="border-color: rgba(255,255,255,0.05); margin-bottom: 15px;">

                <input type="text" id="cust-name" class="form-input" placeholder="Nama Lengkap *" required>
                <textarea id="cust-address" class="form-input" rows="2" placeholder="Alamat Lengkap Pengiriman *" required></textarea>
                <input type="text" id="cust-notes" class="form-input" placeholder="Catatan Tambahan (misal: Bumbu terpisah)">

                <button class="btn-checkout" onclick="checkoutWA()">
                    <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i> Checkout via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Menu Cilok
        const menuData = [
            {
                id: 1,
                nama: "Cilok Bumbu Kacang Classic",
                desc: "Cilok kenyal khas Sunda disiram bumbu kacang gurih manis pedas.",
                harga: 10000,
                hasSpicyOption: true
            },
            {
                id: 2,
                nama: "Cilok Kuah Pedas Minang",
                desc: "Cilok disajikan dengan kuah kaldu pedas gurih rempah ala Sumatera.",
                harga: 12000,
                hasSpicyOption: true
            },
            {
                id: 3,
                nama: "Cilok Bakar Gold Series",
                desc: "Cilok dibakar dengan olesan bumbu rahasia bernuansa manis gurih.",
                harga: 15000,
                hasSpicyOption: false
            },
            {
                id: 4,
                nama: "Cilok Frozen (Pack / Siap Saji)",
                desc: "Kemasan beku hemat. Tinggal dikukus atau direbus kapan aja!",
                harga: 15000,
                hasSpicyOption: false
            }
        ];

        let cart = [];

        // Render Menu ke Halaman
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            menuData.forEach(item => {
                let spicyHTML = item.hasSpicyOption ? `
                    <select id="level-${item.id}" class="spicy-select">
                        <option value="Sedang">Level Pedas: Sedang</option>
                        <option value="Pedas Banget">Level Pedas: Extra Pedas 🌶️</option>
                        <option value="Bumbu Pisah">Bumbu Dipisah</option>
                    </select>
                ` : '';

                container.innerHTML += `
                    <div class="menu-card">
                        <div>
                            <div class="menu-title">${item.nama}</div>
                            <div class="menu-desc">${item.desc}</div>
                        </div>
                        <div>
                            ${spicyHTML}
                            <div class="menu-bottom">
                                <div class="price">Rp ${item.harga.toLocaleString('id-ID')}</div>
                                <button class="btn-add" onclick="addToCart(${item.id})">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Tambah ke Keranjang
        function addToCart(id) {
            const menu = menuData.find(m => m.id === id);
            let option = "-";

            if (menu.hasSpicyOption) {
                option = document.getElementById(`level-${id}`).value;
            }

            const existingIndex = cart.findIndex(c => c.id === id && c.option === option);

            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({ ...menu, qty: 1, option: option });
            }

            updateCartUI();
        }

        // Update Tampilan Keranjang
        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            const totalElement = document.getElementById('total-price');
            const countElement = document.getElementById('cart-count');

            if (cart.length === 0) {
                cartContainer.innerHTML = '<div class="empty-cart">Keranjang masih kosong.<br>Pilih menu di samping!</div>';
                totalElement.innerText = "Rp 0";
                countElement.innerText = "0";
                return;
            }

            cartContainer.innerHTML = '';
            let total = 0;
            let totalCount = 0;

            cart.forEach((item, index) => {
                const subtotal = item.harga * item.qty;
                total += subtotal;
                totalCount += item.qty;

                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.nama}</h4>
                            <p>${item.option !== '-' ? item.option + ' | ' : ''}Rp ${item.harga.toLocaleString('id-ID')}</p>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                            <span style="font-weight: bold; font-size: 0.9rem;">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            totalElement.innerText = `Rp ${total.toLocaleString('id-ID')}`;
            countElement.innerText = totalCount;
        }

        // Ubah Kuantitas
        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        // Kirim ke WhatsApp (FIXED ENCODING EMOJI)
        function checkoutWA() {
            if (cart.length === 0) {
                alert("Pilih minimal 1 menu dulu ya!");
                return;
            }

            const name = document.getElementById('cust-name').value;
            const address = document.getElementById('cust-address').value;
            const notes = document.getElementById('cust-notes').value || "-";

            if (!name || !address) {
                alert("Harap isi Nama Lengkap dan Alamat Pengiriman!");
                return;
            }

            const waNumber = "62881011638072";
            
            let itemText = "";
            let total = 0;

            cart.forEach((item, i) => {
                const subtotal = item.harga * item.qty;
                total += subtotal;
                itemText += `${i + 1}. *${item.nama}* x${item.qty}\n   - Note: ${item.option}\n   - Harga: Rp ${subtotal.toLocaleString('id-ID')}\n`;
            });

            // Teks murni dengan newline biasa (\n)
            const rawText = `🔥 *PESANAN BARU - CILOK JASMIN* 🔥\n\n` +
                            `*DATA PEMBELI:*\n` +
                            `👤 *Nama:* ${name}\n` +
                            `📍 *Alamat:* ${address}\n` +
                            `📝 *Catatan:* ${notes}\n\n` +
                            `*RINCIAN PESANAN:*\n${itemText}\n` +
                            `----------------------------------\n` +
                            `💰 *TOTAL PEMBAYARAN:* *Rp ${total.toLocaleString('id-ID')}*\n\n` +
                            `Mohon segera diproses dan diinfokan ongkirnya ya. Terima kasih! 🚀`;

            // encodeURIComponent dipanggil di sini agar emoji & enter terkonversi dengan benar
            const encodedText = encodeURIComponent(rawText);

            window.open(`https://wa.me/${waNumber}?text=${encodedText}`, '_blank');
        }

        // Inisialisasi awal
        renderMenu();
    </script>

    </script>
</body>
</html>
